baselink_arm_ik_node:
  ros__parameters:
    target_frame: base_link
    left_target_topic: arm_ik/left_target
    right_target_topic: arm_ik/right_target
    joint_state_topic: pico_control_joint_states
    joint_command_topic: pico_control_joint_commands
    left_enable_topic: pico/left_grip
    right_enable_topic: pico/right_grip
    publish_period_sec: 0.01
    target_timeout_sec: 0.5
    smoothing_alpha: 0.13
    max_joint_step_rad: 0.028
    solve_orientation: true
    tcp_offset: [0.08, 0.0, 0.0]
    left_shoulder_origin: [0.0, 0.178, 0.087]
    right_shoulder_origin: [0.0, -0.178, 0.087]
    workspace_min: [-0.25, -0.85, -0.25]
    workspace_max: [0.75, 0.85, 0.95]
    min_lr_tcp_distance: 0.12
    max_position_error_m: 0.002
    max_orientation_error_deg: 2.0
    max_jacobian_condition: 1000.0
    min_joint_limit_margin_rad: 0.005
    ik_status_topic: arm_ik/status
    publish_enable_grip: true
    go_home_service: arm_ik/go_home
    go_handshake_service: arm_ik/go_handshake_ready
    go_demo_pose_a_service: arm_ik/go_demo_pose_a
    go_demo_pose_b_service: arm_ik/go_demo_pose_b
    home_duration_sec: 4.0
    handshake_duration_sec: 4.0
    demo_pose_duration_sec: 2.4
    handshake_tcp_position: [0.35, -0.28, 0.55]
    # Right-arm chest-front posture for customer demo handshake readiness.
    # Joint order:
    # r_shoulder_y, r_shoulder_x, r_shoulder_z, r_elbow_y,
    # r_wrist_x, r_wrist_y, r_wrist_z.
    handshake_right_joints: [0.20, -0.65, -0.35, 0.95, 0.00, 0.20, 0.00]
    # Large visual offsets for the customer demo "arbitrary pose" states.
    demo_pose_a_left_joints: [0.40, 2.45, 1.00, 1.45, -1.20, 0.80, -0.60]
    demo_pose_a_right_joints: [-0.90, -0.55, -1.40, -0.20, 1.20, -0.60, 0.60]
    demo_pose_b_left_joints: [-0.90, 0.45, -1.40, -0.20, -1.20, 0.60, -0.60]
    demo_pose_b_right_joints: [0.45, -2.65, -0.95, 1.55, 1.55, 0.95, 0.78]
