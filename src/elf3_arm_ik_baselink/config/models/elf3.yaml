model_id: elf3
display_name: ELF3 baseline dual-arm model
status: baseline_demo

description: >
  Baseline ELF3 model used by the current base_link dual-arm IK prototype.
  Additional customer-specified biped models should add separate files in this
  directory with the same schema.

frames:
  base: base_link
  visualization_fixed: torso_link

urdf:
  left_arm: data/elf3_arm_l.urdf
  right_arm: data/elf3_arm_r.urdf

left_arm:
  side: left
  shoulder_origin_in_base: [0.00, 0.178, 0.087]
  joint_names:
    - l_shoulder_y_joint
    - l_shoulder_x_joint
    - l_shoulder_z_joint
    - l_elbow_y_joint
    - l_wrist_x_joint
    - l_wrist_y_joint
    - l_wrist_z_joint
  home_joints: [0.50, 0.30, -0.10, -0.20, 0.00, 0.00, 0.00]
  tcp_offset: [0.08, 0.00, 0.00]

right_arm:
  side: right
  shoulder_origin_in_base: [0.00, -0.178, 0.087]
  joint_names:
    - r_shoulder_y_joint
    - r_shoulder_x_joint
    - r_shoulder_z_joint
    - r_elbow_y_joint
    - r_wrist_x_joint
    - r_wrist_y_joint
    - r_wrist_z_joint
  home_joints: [0.50, -0.30, 0.10, -0.20, 0.00, 0.00, 0.00]
  handshake_ready_joints: [0.20, -0.65, -0.35, 0.95, 0.00, 0.20, 0.00]
  tcp_offset: [0.08, 0.00, 0.00]

workspace:
  min: [-0.25, -0.85, -0.25]
  max: [0.75, 0.85, 0.95]
  min_lr_tcp_distance: 0.12

ik_validation:
  max_position_error_m: 0.002
  max_orientation_error_deg: 2.0
  max_jacobian_condition: 1000.0
  min_joint_limit_margin_rad: 0.005

demo_poses:
  pose_a:
    left_joints: [0.40, 2.45, 1.00, 1.45, -1.20, 0.80, -0.60]
    right_joints: [-0.90, -0.55, -1.40, -0.20, 1.20, -0.60, 0.60]
  pose_b:
    left_joints: [-0.90, 0.45, -1.40, -0.20, -1.20, 0.60, -0.60]
    right_joints: [0.45, -2.65, -0.95, 1.55, 1.55, 0.95, 0.78]

trajectory_defaults:
  home_duration_sec: 4.0
  handshake_duration_sec: 4.0
  demo_pose_duration_sec: 2.4
  publish_period_sec: 0.01
  smoothing_alpha: 0.13
  max_joint_step_rad: 0.028
  max_velocity_rad_s: 0.60
  max_acceleration_rad_s2: 1.20
  control_period_sec: 0.02
  cancel_safe_return_mode: home

collision_proxy:
  status: todo_site_calibration_required
  notes: >
    Placeholder for simplified capsule/sphere/box collision proxies. Parameters
    must be calibrated with customer hardware and confirmed safety margins.
